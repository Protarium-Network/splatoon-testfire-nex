services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testfire
      POSTGRES_USER: testfire
      POSTGRES_PASSWORD: testfire
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testfire -d testfire"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - testfire-postgres:/var/lib/postgresql/data

  nex:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PN_GLOBAL_TESTFIRE_AUTHENTICATION_SERVER_PORT: "60000"
      PN_GLOBAL_TESTFIRE_SECURE_SERVER_HOST: ${PN_GLOBAL_TESTFIRE_SECURE_SERVER_HOST}
      PN_GLOBAL_TESTFIRE_SECURE_SERVER_PORT: "60001"
      PN_GLOBAL_TESTFIRE_POSTGRES_URI: postgres://testfire:testfire@postgres:5432/testfire?sslmode=disable
      PN_GLOBAL_TESTFIRE_LOCAL_MODE: "1"
      PN_GLOBAL_TESTFIRE_SETTINGS_PATH: /home/go/app/settings.json
      PN_GLOBAL_TESTFIRE_NEX_BUILD_NAME: ${PN_GLOBAL_TESTFIRE_NEX_BUILD_NAME:-}
    ports:
      - "60000:60000/udp"
      - "60001:60001/udp"
    volumes:
      - ./settings.json:/home/go/app/settings.json:ro

volumes:
  testfire-postgres:
